; Everything the container runs, started by docker/entrypoint.sh once the
; database is migrated. All output goes to the container log (docker logs).
;
; Shutdown runs in reverse priority -- Nginx stops taking requests first,
; then gunicorn finishes the ones in flight, then Postgres stops cleanly --
; so give `docker stop` time for all three (compose.yaml: stop_grace_period).

[supervisord]
nodaemon=true
user=root
; In the foreground supervisord prints its own log to stdout already; a
; logfile there too would print every line twice.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; For `supervisorctl` inside the container. Only root can open the socket
; (chmod) -- that's the protection. The credentials just stop supervisord
; logging a CRIT warning about their absence on every start.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700
username=supervisor
password=supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock
username=supervisor
password=supervisor

[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /data/postgres
user=postgres
priority=10
startsecs=3
autorestart=true
; SIGINT is Postgres's "fast" shutdown: roll back open transactions, then
; stop cleanly. SIGTERM would wait for every client to disconnect.
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gunicorn]
command=/opt/gym/bin/start-gunicorn
directory=/app
user=gym
priority=20
startsecs=5
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
startsecs=2
autorestart=true
; SIGQUIT lets Nginx finish the requests it's serving.
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backups]
command=/opt/gym/bin/backup-scheduler
priority=40
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
