# Plain http on port 80: what runs until a certificate is mounted (DEPLOY.md).
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Lets certbot on the host get the first certificate (DEPLOY.md).
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    include /etc/nginx/gym/app.conf;
}
