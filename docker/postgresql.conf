# Postgres settings for the container. The data directory's own
# postgresql.conf includes this file last (docker/entrypoint.sh makes sure
# of it on every start), so these win over it and a new image can change
# them for an existing database.

# The Unix socket only: nothing outside the container can reach the
# database, whatever ports get published.
listen_addresses = ''
unix_socket_directories = '/run/postgresql'

# JIT compiles huge analytical queries to machine code; a gym's database
# never runs one. The image leaves LLVM out (about 175 MB) to match.
jit = off
