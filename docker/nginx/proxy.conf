# Hand a request to gunicorn, telling Django what the browser actually asked
# for (gym_backend/settings/container.py relies on every header here).
proxy_pass http://127.0.0.1:8000;
proxy_redirect off;
proxy_read_timeout 120s;

# $http_host keeps the port, so links Django builds still work when the
# site is reached on a non-standard one.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# One address, the one Nginx vouches for -- never a client-supplied chain
# (DRF reads the last entry, NUM_PROXIES=1).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
