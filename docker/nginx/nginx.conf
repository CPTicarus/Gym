# Nginx in the all-in-one image: serves the built frontend and the public
# uploads itself, and hands the API and the Django admin to gunicorn.
#
# Which server blocks run is decided at start-up: site-http.conf, or
# site-https.conf once a certificate is mounted (docker/entrypoint.sh).
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    '$request_time';
    access_log /dev/stdout main;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Written by the entrypoint: upload size, trusted proxies,
    # $forwarded_proto and the certificate paths.
    include /etc/nginx/gym/runtime.conf;

    include /etc/nginx/conf.d/*.conf;
}
