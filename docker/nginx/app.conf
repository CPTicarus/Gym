# What the site serves -- shared by the http and https server blocks.

root /app/frontend;

location /api/chat/ {
    include /etc/nginx/gym/chat-upload.conf;
    include /etc/nginx/gym/proxy.conf;
}

location /api/ {
    include /etc/nginx/gym/proxy.conf;
}

location /admin/ {
    include /etc/nginx/gym/proxy.conf;
}

# Django admin and DRF assets, collected into the image when it was built.
location /static/ {
    alias /app/staticfiles/;
    expires 7d;
    access_log off;
}

# Public uploads: move demos, blog covers, profile pictures. Members' body
# photos are NOT here -- they're in /data/private_media, where only Django
# reads them, after checking who's asking (apps/accounts/views.py).
location /media/ {
    alias /data/media/;
    expires 7d;
    access_log off;
    # An upload is never a page. Even a file that manages to pass for HTML
    # gets no script, no forms, nothing to load.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    add_header X-Content-Type-Options nosniff always;
}

# Vite's bundles have the content hash in their names, so they never change.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}

# Everything else belongs to the single-page app: the file if there is one,
# otherwise index.html and React's router takes it from there.
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
